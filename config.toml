# The URL the site will be built for
base_url = "https://eakkz.github.io/eakkz-blog"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false


title = "Eakkz Ekachai"
description = "I'm Ekachai, a data engineer in Bangkok. I write about databases, automation, coding agents, gaming, and my seven cats."
default_language = "en"
theme = "serene"
output_dir = "public"
minify_html = false # Keep this false, as it may cause issues with some styles
generate_feeds = false # Whether to generate a feed file in root, read docs for more info about rss feed
feed_filenames = ["feed.xml"] # "feed.xml" | "atom.xml" | "rss.xml", read docs for more info
taxonomies = [{ name = "tags" }, { name = "categories" }]

[markdown]
github_alerts = true
render_emoji = false
external_links_target_blank = false
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra]
# Put all your custom variables here
nav = [
  { name = "posts", path = "/posts" },
  { name = "about", path = "/about" },
  { name = "resume", path = "/resume" },
  # { name = "tags", path = "/tags" },
]

# Home page info; comment out handle/bio/avatar to hide them
name = "Ekachai Suriyakriengkri"
handle = "eakkz"
bio = "🐱 Cat person | 🎮 Gamer | ✈️ Traveler | 🍜 Ramen enthusiast"
avatar = "img/avatar.jpg"
links = [
  { name = "GitHub", icon = "github", url = "https://github.com/eakkz" },
  { name = "Linkedin", icon = "linkedin", url = "https://www.linkedin.com/in/ekachai1012/" },
  { name = "Email", icon = "email", url = "mailto:ekachai.suriya@gmail.com" },
]
blog_section_path = "/posts"

back_link_text = "Back" # Text of the back button
color_scheme = "auto" # "auto" | "light" | "dark"
og_image = "img/avatar.jpg" # default link-preview image (Open Graph)
date_format = "%Y-%m-%d" # site-wide; a section or post can override

footer_copyright = "© 2026 Eakkz"
footer_credits = true # Whether to show "Built with zola and serene" in footer

not_found_error_text = "404 Not Found"
not_found_recover_text = "« back to home »"

reaction = false # Whether to enable anonymous emoji reactions (Note: You need to set up a working api endpoint to enable this feature)
reaction_align = "right" # "left" | "center" | "right"
reaction_endpoint = "https://example.com/api/reaction"
