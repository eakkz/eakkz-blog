{#- Responsive, subpath-safe figure for a colocated post image.
    Usage in markdown: {{ <figure src="haku.jpg" alt="..." caption="..." width={1000} /> }}
    Overrides Serene's own `figure` component (adds build-time resize, lazy load, full-size link).
    Output stays markdown-safe: no blank lines, no 4+ space indents. -#}
{% component figure(src: string, alt: string = "", caption: string = "", width: integer = 1000, @page) -%}
{%- set img = resize_image(path=page.colocated_path ~ src, width=width, op="fit_width", quality=82) -%}
<figure class="post-figure">
<a class="post-figure__link" href="{{ get_url(path=page.colocated_path ~ src) | safe }}" target="_blank" rel="noopener" aria-label="Open full-size image in a new tab">
<img src="{{ img.url | safe }}" width="{{ img.width }}" height="{{ img.height }}" alt="{{ alt }}" loading="lazy" decoding="async">
</a>
{%- if caption %}
<figcaption class="post-figure__caption">{{ caption }}</figcaption>
{%- endif %}
</figure>
{%- endcomponent figure %}
